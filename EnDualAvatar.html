        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 320px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {

            }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            height: 100%;

        .gemini-card {
            background-color: #0f172a;
            border: 1px solid #475569;
        }
        .list-check {
            list-style-type: none;
            padding-left: 0;
        }
        .list-check li {
            position: relative;
            padding-left: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .list-check li.placeholder {
            color: #94a3b8;
        }
        .list-check li.placeholder::before {
            content: '-';
            color: #94a3b8;
        }
        .list-check li:not(.placeholder)::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #34d399;
            font-weight: bold;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .lang-btn {
            background-color: #334155;
            color: #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;

        .lang-btn:hover {

        }
        .lang-btn.active {
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            border-color: #818cf8;

                error_api: "Произошла ошибка",
                error_api_generic: "Не удалось получить данные о персонах от ИИ.",
                error_parsing: "Ошибка при разборе данных от ИИ.",
                error_invalid_data: "Получены данные о персонах от ИИ в неверном формате.",
                persona_evangelist_name: "Евангелист",
                persona_lookalike_name: "Похожий покупатель",
                persona_bio_fallback: "Нет описания.",
                persona_characteristics: "Характеристики:",
                persona_characteristics_fallback: "Нет данных о характеристиках.",
                gemini_prompt: `Как бренд-стратег, для категории продуктов/услуг: "{productCategory}", пожалуйста, создайте 2 персоны ИИ-инфлюенсеров на русском языке, с четкой структурой для каждой части:
1.  "Евангелист категории" (Category Evangelist):
    - name: Короткое, лаконичное, профессионально звучащее имя (Важно: не включайте биографию или черты в имя).
    - bio: Биография, описывающая их экспертизу (около 2-3 предложений).
    - characteristics: 3 ключевые черты (в виде списка).
2.  "Похожий покупатель" (Buyer Lookalike):
    - name: Короткое, лаконичное, дружелюбно звучащее имя (Важно: не включайте биографию или черты в имя).
    - bio: Биография, описывающая их образ жизни и связь с продуктом (около 2-3 предложений).
    - characteristics: 3 ключевые черты (в виде списка).`
            }
        };

        // --- SCRIPT LOGIC ---
        const generateBtn = document.getElementById('generate-btn');
        const productInput = document.getElementById('product-input');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const personaOutput = document.getElementById('persona-output');
        let currentLang = 'th';
        let comparisonChart;

        // =================================================================
        // !! IMPORTANT: Please insert your GOOGLE AI API KEY here before use !!
        // You can get a free key from Google AI Studio (ai.google.dev)
        // The Avatar generator feature will not work without it.
        // =================================================================
        const apiKey = "AIzaSyDj_fOvwZ80qfWaryvy5FNjSiyKt1wAF04"; // <--- PASTE YOUR API KEY HERE

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLanguage', lang);
            const content = translations[lang];

            // Update all text elements
            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                if (content[key]) {
                    element.innerHTML = content[key];
                }
            });

            // Update all placeholder elements
            document.querySelectorAll('[data-key-placeholder]').forEach(element => {
                const key = element.getAttribute('data-key-placeholder');
                if (content[key]) {
                    element.placeholder = content[key];
                }
            });
            
            // Update HTML lang attribute
            document.documentElement.lang = lang;

            // Update active button style
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`lang-${lang}`).classList.add('active');

            // Update Chart
            renderComparisonChart(lang);
        }

        function renderComparisonChart(lang) {
            const ctx = document.getElementById('comparisonChart').getContext('2d');
            const content = translations[lang];

            const wrapLabel = (label, maxLength = 16) => {
                if (label.length <= maxLength) return label;
                const words = label.split(' ');
                const lines = [];
                let currentLine = '';
                for (const word of words) {
                    if ((currentLine + ' ' + word).trim().length > maxLength && currentLine.length > 0) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = currentLine ? currentLine + ' ' + word : word;
                    }
                }
                lines.push(currentLine);
                return lines;
            };

            const data = {
                labels: content.chart_labels.map(label => wrapLabel(label)),
                datasets: [{
                    label: content.chart_legend_ai,
                    data: [10, 10, 9, 10, 6, 7],
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: '#3b82f6',
                    pointBackgroundColor: '#3b82f6',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#3b82f6'
                }, {
                    label: content.chart_legend_human,
                    data: [4, 6, 5, 7, 10, 10],
                    backgroundColor: 'rgba(236, 72, 153, 0.2)',
                    borderColor: '#ec4899',
                    pointBackgroundColor: '#ec4899',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#ec4899'
                }]
            };

            const options = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#e2e8f0', font: { family: "'Kanit', 'Noto Sans', 'Noto Sans SC', sans-serif" } } },
                    tooltip: {
                        titleFont: { family: "'Kanit', 'Noto Sans', 'Noto Sans SC', sans-serif" },
                        bodyFont: { family: "'Kanit', 'Noto Sans', 'Noto Sans SC', sans-serif" },
                        callbacks: {
                            title: (tooltipItems) => {
                                const item = tooltipItems[0];
                                let label = item.chart.data.labels[item.dataIndex];
                                return Array.isArray(label) ? label.join(' ') : label;
                            }
                        }
                    }
                },
                scales: {
                    r: {
                        angleLines: { color: 'rgba(226, 232, 240, 0.2)' },
                        grid: { color: 'rgba(226, 232, 240, 0.2)' },
                        pointLabels: { color: '#e2e8f0', font: { size: 12, family: "'Kanit', 'Noto Sans', 'Noto Sans SC', sans-serif" } },
                        ticks: {
                            color: '#0f172a',
                            backdropColor: 'rgba(226, 232, 240, 0.8)',
                            stepSize: 2
                        }
                    }
                }
            };
            
            if (comparisonChart) {
                comparisonChart.destroy();
            }
            comparisonChart = new Chart(ctx, { type: 'radar', data: data, options: options });
        }


        generateBtn.addEventListener('click', async () => {
            const content = translations[currentLang];
            if (!apiKey) {
                errorMessage.textContent = content.error_missing_key;
                errorMessage.classList.remove('hidden');
                return;
            }

            const productCategory = productInput.value;
            if (!productCategory.trim()) {
                errorMessage.textContent = content.error_missing_input;
                errorMessage.classList.remove('hidden');
                return;
            }
            
            generateBtn.disabled = true;
            generateBtn.textContent = content.gemini_button_loading;
            loader.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            personaOutput.classList.add('hidden');
            personaOutput.innerHTML = '';

            const prompt = content.gemini_prompt.replace('{productCategory}', productCategory);

            const schema = {
                type: "OBJECT",
                properties: {
                    evangelist: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            bio: { type: "STRING" },
                            characteristics: { type: "ARRAY", items: { type: "STRING" } }
                        },
                        required: ["name", "bio", "characteristics"]
                    },
                    lookalike: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            bio: { type: "STRING" },
                            characteristics: { type: "ARRAY", items: { type: "STRING" } }
                        },
                        required: ["name", "bio", "characteristics"]
                    }
                }
            };

            try {
                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: schema
                    }
                };
                
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API Error: ${response.status} ${response.statusText}. Body: ${errorBody}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates[0]?.content?.parts?.[0]) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    const cleanedJsonText = jsonText.replace(/[\u0000-\u001F\u007F-\u009F]/g, "");
                    try {
                        const data = JSON.parse(cleanedJsonText);
                        displayPersonas(data);
                    } catch (parseError) {
                        console.error('JSON Parse Error:', parseError, 'Malformed JSON:', cleanedJsonText);
                        throw new Error(content.error_parsing);
                    }
                } else {
                    let errorText = content.error_api_generic;
                    if(result.promptFeedback?.blockReason){
                       errorText += ` (Reason: ${result.promptFeedback.blockReason})`;
                    }
                    throw new Error(errorText);
                }

            } catch (error) {
                console.error('Error calling Gemini API:', error);
                errorMessage.textContent = `${content.error_api}: ${error.message}.`;
                errorMessage.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.textContent = content.gemini_button;
            }
        });

        function displayPersonas(data) {
            const content = translations[currentLang];
            if (!data || typeof data !== 'object') {
                console.error("Invalid data object received:", data);
                errorMessage.textContent = content.error_invalid_data;
                errorMessage.classList.remove('hidden');
                return;
            }

            const evangelist = data.evangelist || {};
            const lookalike = data.lookalike || {};

            const evangelistChars = (Array.isArray(evangelist.characteristics) && evangelist.characteristics.length > 0)
                ? evangelist.characteristics.map(c => `<li>${String(c)}</li>`).join('')
                : `<li class="placeholder">${content.persona_characteristics_fallback}</li>`;

            const lookalikeChars = (Array.isArray(lookalike.characteristics) && lookalike.characteristics.length > 0)
                ? lookalike.characteristics.map(c => `<li>${String(c)}</li>`).join('')
                : `<li class="placeholder">${content.persona_characteristics_fallback}</li>`;

            const evangelistHtml = `
                <div class="gemini-card rounded-lg p-6 flex flex-col h-full">
                    <div class="text-center mb-4">
                        <div class="text-4xl">🧠</div>
                        <h3 class="text-2xl font-bold text-sky-400 mt-2 break-words">${evangelist.name || content.persona_evangelist_name}</h3>
                        <p class="font-semibold text-white">${translations[currentLang].evangelist_subtitle || '(Category Evangelist)'}</p>
                    </div>
                    <div class="flex-grow flex flex-col">
                        <p class="text-slate-300 mb-4 break-words flex-grow">${evangelist.bio || content.persona_bio_fallback}</p>
                        <div>
                            <h4 class="font-bold text-white mb-2">${content.persona_characteristics}</h4>
                            <ul class="list-check text-slate-300">${evangelistChars}</ul>
                        </div>
                    </div>
                </div>`;

            const lookalikeHtml = `
                <div class="gemini-card rounded-lg p-6 flex flex-col h-full">
                    <div class="text-center mb-4">
                        <div class="text-4xl">🤝</div>
                        <h3 class="text-2xl font-bold text-pink-400 mt-2 break-words">${lookalike.name || content.persona_lookalike_name}</h3>
                        <p class="font-semibold text-white">${translations[currentLang].lookalike_subtitle || '(Buyer Lookalike)'}</p>
                    </div>
                    <div class="flex-grow flex flex-col">
                        <p class="text-slate-300 mb-4 break-words flex-grow">${lookalike.bio || content.persona_bio_fallback}</p>
                        <div>
                            <h4 class="font-bold text-white mb-2">${content.persona_characteristics}</h4>
                            <ul class="list-check text-slate-300">${lookalikeChars}</ul>
                        </div>
                    </div>
                </div>`;
            
            personaOutput.innerHTML = evangelistHtml + lookalikeHtml;
            personaOutput.classList.remove('hidden');
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLanguage');
            const browserLang = navigator.language.split('-')[0];
            
            let initialLang = 'th'; // Default
            if (savedLang && translations[savedLang]) {
                initialLang = savedLang;
            } else if (translations[browserLang]) {
                initialLang = browserLang;
            }
            
            changeLanguage(initialLang);
        });

    </script>
</body>
